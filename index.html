<html lang="en">
<head>

<body>

        <h1 id="logo">SUP-World</h1>

</body>

<script>
    var menu = document.getElementById("menu")
    var header = document.getElementById("header");
    
    menu.addEventListener("click", function(){
    header.style.display="flex";

    var close = document.getElementById("close");
    close.addEventListener("click", function(){
        header.style.display="none";
    })})

    var box1 = getElementById("box1");
    var box2 = getElementById("box2");
    var box3 = getElementById("box3");
    function instagram (){document.location.href="https://www.instagram.com/";}
    function twitter (){document.location.href="https://twitter.com/?lang=de";}
    function youtube (){document.location.href="https://www.youtube.com/@GalileoOffiziell";}
</script>
